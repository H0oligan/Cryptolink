version: '3.8'
services:
  cryptolink:
    image: ghcr.io/h0oligan/cryptolink:latest
    command: all-in-one --skip-config
    env_file:
      - docker.env
    volumes:
      - './tmp:/src/tmp'
    ports: [ '80:80' ]
    networks: [ net-cryptolink ]
    depends_on: [ postgres ]
    restart: on-failure

  postgres:
    image: postgres:15-alpine
    command: postgres -c log_statement=all
    restart: on-failure
    environment:
      - POSTGRES_DB=cryptolink
      - POSTGRES_USER=cryptolink
      - POSTGRES_PASSWORD=cryptolink
    volumes:
      - 'pg-data:/var/lib/postgresql/data'
    ports: [ '5432:5432' ]
    networks: [ net-cryptolink ]

networks:
  net-cryptolink:

volumes:
  app-volume:
  pg-data:
